# Default ranking weights — used from Part 5 onward.
recency: 0.30
in_network_boost: 0.25
engagement: 0.15
author_affinity: 0.10
similarity: 0.20
seen_penalty: -0.30
not_interested_author: -0.40
# Post-score multipliers (not signals). First post from an author keeps 1.0.
author_diversity_decay: 0.50
author_diversity_floor: 0.25
